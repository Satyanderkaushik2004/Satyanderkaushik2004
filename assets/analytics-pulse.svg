<svg width="700" height="160" viewBox="0 0 700 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="barGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#F472B6"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>

  <rect width="700" height="160" rx="12" fill="#0D1117"/>

  <!-- animated bars -->
  <g>
    <rect x="40"  y="100" width="28" height="40" rx="4" fill="url(#barGrad)">
      <animate attributeName="height" values="40;90;40" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="y" values="100;50;100" dur="2.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="90"  y="70"  width="28" height="70" rx="4" fill="url(#barGrad)">
      <animate attributeName="height" values="70;110;70" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="y" values="70;30;70" dur="2.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="140" y="90"  width="28" height="50" rx="4" fill="url(#barGrad)">
      <animate attributeName="height" values="50;100;50" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="y" values="90;40;90" dur="2s" repeatCount="indefinite"/>
    </rect>
    <rect x="190" y="55"  width="28" height="85" rx="4" fill="url(#barGrad)">
      <animate attributeName="height" values="85;120;85" dur="3.1s" repeatCount="indefinite"/>
      <animate attributeName="y" values="55;20;55" dur="3.1s" repeatCount="indefinite"/>
    </rect>
    <rect x="240" y="80"  width="28" height="60" rx="4" fill="url(#barGrad)">
      <animate attributeName="height" values="60;95;60" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="y" values="80;45;80" dur="2.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- glowing pulse dot moving across a line -->
  <line x1="20" y1="145" x2="680" y2="145" stroke="#1E293B" stroke-width="1"/>
  <circle r="4" fill="#22D3EE">
    <animateMotion dur="4s" repeatCount="indefinite" path="M20,145 L680,145"/>
    <animate attributeName="opacity" values="1;0.3;1" dur="1s" repeatCount="indefinite"/>
  </circle>

  <text x="40" y="25" fill="#94A3B8" font-family="monospace" font-size="14">contributions.stream()</text>
</svg>
