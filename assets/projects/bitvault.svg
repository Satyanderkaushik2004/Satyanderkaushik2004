  <text x="47" y="140" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#22D3EE" letter-spacing="2">SECURE FILE SHARING</text>
  <line x1="47" y1="155" x2="220" y2="155" stroke="url(#glow-bitvault)" stroke-width="2"/>
